# Creating PV is k8 admin job
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
spec:
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain # retain means dont delete data, recycle means delete data, but dont delete disk, Delete means delete the disk.
  capacity:
    storage: 15Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0123456789abcdef0 # Your EBS Volume ID
 
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "" # Empty string must be explicitly set otherwise default StorageClass will be set
  volumeName: ebs-static
  resources:
    requests:
      storage: 15Gi # value is not more than PV storage size

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels: 
    purpose: ebs-static
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-html
      mountPath: /usr/share/nginx/html # Path inside the container
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1b # select node as us-east-1b region 
  volumes:
  - name: nginx-html
    persistentVolumeClaim:
      claimName: ebs-static # Must match the PVC name above

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-ebs-static
spec:
  type: LoadBalancer
  selector:
    purpose: ebs-static
  ports:
  - protocol: TCP
    port: 80 # service port
    targetPort: 80 # container port
    nodePort: 30007
  


